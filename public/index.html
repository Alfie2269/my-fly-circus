<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fly Circus</title>
<style>
:root{--bg:#1b1424;--fg:#f6ecd9;--panel:rgba(32,22,44,.86);--bar:#4a3b5e;--gold:#f2b632;--red:#e0483a;--ok:#5fbf7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d1a}}
:root[data-theme="dark"]{--bg:#120d1a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.35 Georgia,"Times New Roman",serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}
.p{position:absolute;background:var(--panel);border-radius:10px;padding:10px 12px;backdrop-filter:blur(6px)}
#hud{left:10px;bottom:10px;width:min(300px,calc(100vw - 20px));max-height:42vh;overflow:auto}
#hud .f{margin-bottom:7px}
#hud .f b{font-size:14px}
#hud .a{opacity:.75;font-style:italic;margin-left:4px}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:3px}
.bars i{display:block;height:5px;background:var(--bar);border-radius:3px;overflow:hidden}
.bars i span{display:block;height:100%;background:var(--gold)}
#inbox{right:10px;top:calc(10px + env(safe-area-inset-top,0px));width:min(260px,calc(100vw - 20px));max-height:44vh;overflow:auto}
#inbox h3{margin:0 0 4px;font-size:15px;font-weight:normal;color:var(--gold)}
#inbox small{display:block;opacity:.65;margin-bottom:8px}
.r{border-top:1px solid var(--bar);padding:7px 0}
.r button{font:inherit;border:0;border-radius:6px;padding:4px 10px;margin-right:6px;margin-top:5px;cursor:pointer;color:#1b1424}
.r .y{background:var(--ok)}.r .n{background:#c9b9d8}
#help{left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));padding:6px 12px;white-space:nowrap;font-size:12px}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:11px;background:rgba(20,12,30,.7);padding:1px 6px;border-radius:8px;pointer-events:none;white-space:nowrap}
#pad{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:4px}
#pad button{background:var(--panel);color:var(--fg);border:0;border-radius:8px;font-size:16px;touch-action:none}
#pad .w{grid-column:2}
@media (hover:hover) and (pointer:fine){#pad{display:none}}
@media (max-width:700px){#help{display:none}}
</style>
</head>

<div class="p" id="help">Drag to look · WASD or arrows to walk · Shift to run</div>
<div class="p" id="hud"></div>
<div class="p" id="inbox"><h3>Admin inbox</h3><small>Only admins see this inbox. Approvals are checked on the server.</small><div id="rq"></div></div>
<div id="pad"><button class="w" data-k="KeyW">▲</button><button data-k="KeyA" style="grid-row:2">◀</button><button data-k="KeyS" style="grid-row:2">▼</button><button data-k="KeyD" style="grid-row:2">▶</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const renderer=new THREE.WebGLRenderer({antialias:true});

const scene=new THREE.Scene();const SKY=new THREE.Color(0x8fd0ff);scene.background=SKY;scene.fog=new THREE.Fog(0x8fd0ff,45,160);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,260);
cam.rotation.order="YXZ";
const hemi=new THREE.HemisphereLight(0xfff1d6,0x5a4470,.95);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff0d0,.8);sun.position.set(30,50,20);scene.add(sun);
const lamp=new THREE.PointLight(0xffd9a0,.9,40);lamp.position.set(0,5.5,0);scene.add(lamp);

function tex(w,h,draw,rx,ry){const k=document.createElement("canvas");k.width=w;k.height=h;draw(k.getContext("2d"),w,h);const t=new THREE.CanvasTexture(k);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rx)t.repeat.set(rx,ry);return t}
const box=(w,h,d,col,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));m.position.set(x,y,z);scene.add(m);return m};

// room: checker floor, striped tent walls
const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,16),new THREE.MeshLambertMaterial({map:tex(128,128,(g)=>{g.fillStyle="#f1e3c4";g.fillRect(0,0,128,128);g.fillStyle="#b5473b";g.fillRect(0,0,64,64);g.fillRect(64,64,64,64)},8,8)}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
const stripe=tex(128,32,(g)=>{for(let i=0;i<8;i++){g.fillStyle=i%2?"#f6ecd9":"#d23d33";g.fillRect(i*16,0,16,32)}},4,1);
const wm=new THREE.MeshLambertMaterial({map:stripe});
const OB=[];let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const hit=(x,z)=>OB.some(o=>x>o[0]&&x<o[1]&&z>o[2]&&z<o[3]);const inT=p=>Math.abs(p.x)<8&&Math.abs(p.z)<8;
[[0,-8,16,.3],[-5,8,6,.3],[5,8,6,.3],[-8,0,.3,16],[8,0,.3,16]].forEach(([x,z,w,d])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,6,d),wm);m.position.set(x,3,z);scene.add(m);OB.push([x-w/2-.4,x+w/2+.4,z-d/2-.4,z+d/2+.4])});
const roof=new THREE.Mesh(new THREE.ConeGeometry(12.5,5,24,1,true),new THREE.MeshLambertMaterial({map:tex(128,32,(g)=>{for(let i=0;i<8;i++){g.fillStyle=i%2?"#f6ecd9":"#d23d33";g.fillRect(i*16,0,16,32)}},6,1),side:THREE.DoubleSide}));roof.position.y=8.5;scene.add(roof);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({map:tex(64,64,(g,w,h)=>{g.fillStyle="#4f9a4a";g.fillRect(0,0,w,h);for(let i=0;i<260;i++){g.fillStyle=rnd()<.5?"#58a653":"#448a40";g.fillRect(rnd()*w,rnd()*h,2,2)}},100,100)}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;scene.add(ground);
box(4,.04,64,0xd9c79a,0,0,40);box(104,.04,4,0xd9c79a,0,.01,30);
// fountain
box(5,.6,5,0xb9b9c2,0,.3,30);box(4.2,.1,4.2,0x4aa3e0,0,.62,30);box(.3,2.4,.3,0x9fd3ff,0,1.6,30);
// houses
function house(x,z,col){const s=z<30?1:-1;box(7,4,6,col,x,2,z);const r=new THREE.Mesh(new THREE.ConeGeometry(5.6,2.6,4),new THREE.MeshLambertMaterial({color:0x8a3b2f}));r.rotation.y=Math.PI/4;r.position.set(x,5.3,z);scene.add(r);box(1.2,2.2,.1,0x4a2c1a,x,1.1,z+3.05*s);box(1.4,1.2,.1,0xffe9a6,x-2,2.4,z+3.05*s);OB.push([x-3.9,x+3.9,z-3.4,z+3.4])}
[[-34,22,0xe8c9a0],[-20,22,0xa9c8e8],[20,22,0xe8a9b8],[34,22,0xb8e0a9],[-34,38,0xf0dc9a],[-20,38,0xd2b4e8],[20,38,0xa9e0d6],[34,38,0xe8b890]].forEach(h=>house(...h));
// lamps
for(const z of[14,22,38,46,54,62])for(const x of[-3,3]){box(.15,3.4,.15,0x333333,x,1.7,z);const l=new THREE.Mesh(new THREE.SphereGeometry(.3,8,8),new THREE.MeshBasicMaterial({color:0xffe08a}));l.position.set(x,3.6,z);scene.add(l)}
// food stall, hammock, park bench and pond
box(3,1.2,1.2,0x7a4b2a,10,.6,23);box(3.6,.15,2.2,0xd23d33,10,2.5,23.3);box(.12,2.4,.12,0x5a3a20,8.4,1.2,24);box(.12,2.4,.12,0x5a3a20,11.6,1.2,24);
box(.2,2.2,.2,0x5a3a20,-14,1.1,46);box(.2,2.2,.2,0x5a3a20,-10,1.1,46);box(3.4,.12,.9,0xd8a35a,-12,1.2,46);
box(2,.12,.7,0x7a4b2a,-28,.5,58);box(2,.6,.12,0x7a4b2a,-28,.85,58.35);box(.12,.5,.5,0x333333,-28.8,.25,58);box(.12,.5,.5,0x333333,-27.2,.25,58);
const pond=new THREE.Mesh(new THREE.CylinderGeometry(8,8,.06,32),new THREE.MeshLambertMaterial({color:0x3a8fd6}));pond.position.set(-38,.01,58);scene.add(pond);
// ferris wheel
const root=new THREE.Group();root.position.set(30,9.5,58);root.rotation.y=Math.PI/2;scene.add(root);const fw=new THREE.Group();root.add(fw);const gondolas=[];
fw.add(new THREE.Mesh(new THREE.TorusGeometry(8,.25,8,32),new THREE.MeshLambertMaterial({color:0xf2b632})));
for(let i=0;i<4;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(16,.12,.12),new THREE.MeshLambertMaterial({color:0xe0483a}));s.rotation.z=i*Math.PI/4;fw.add(s)}
for(let i=0;i<8;i++){const a=i*Math.PI/4,g=new THREE.Mesh(new THREE.BoxGeometry(1.3,.9,1),new THREE.MeshLambertMaterial({color:i%2?0x5fbf7a:0x4aa3e0}));g.position.set(Math.cos(a)*8,Math.sin(a)*8,0);fw.add(g);gondolas.push(g)}
[-1,1].forEach(s=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.4,10,.4),new THREE.MeshLambertMaterial({color:0xdddddd}));l.position.set(s*2.2,-4.7,0);l.rotation.z=-s*.3;root.add(l)});
// trees
const tg1=new THREE.CylinderGeometry(.25,.35,2,6),tg2=new THREE.ConeGeometry(1.7,4,8),tm1=new THREE.MeshLambertMaterial({color:0x6b4a2b}),tm2=[0x2f7d3a,0x3f9448,0x2a6e3c].map(c=>new THREE.MeshLambertMaterial({color:c}));
for(let i=0,n=0;n<150&&i<1500;i++){const x=(rnd()-.5)*190,z=(rnd()-.5)*190;if((Math.abs(x)<14&&Math.abs(z)<14)||(Math.abs(x)<4&&z>8)||(Math.abs(z-30)<4&&Math.abs(x)<52)||(Math.abs(x)<48&&z>14&&z<72))continue;n++;const s=.8+rnd()*.9,a=new THREE.Mesh(tg1,tm1),b=new THREE.Mesh(tg2,tm2[n%3]);a.position.set(x,s,z);b.position.set(x,3.8*s,z);a.scale.setScalar(s);b.scale.setScalar(s);scene.add(a,b)}
// sky
const clouds=[];for(let i=0;i<14;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.85,fog:false}));m.scale.set(6+rnd()*6,1.6,3.5+rnd()*3);m.position.set(0,38+rnd()*12,(rnd()-.5)*200);m.userData.x=(rnd()-.5)*240;scene.add(m);clouds.push(m)}
const NIGHT=new THREE.Color(0x120d28),DAY=new THREE.Color(0x8fd0ff);
function dayNight(t){const d=(Math.sin(t*.05+1.2)+1)/2;SKY.lerpColors(NIGHT,DAY,d);scene.fog.color.copy(SKY);hemi.intensity=.3+.65*d;sun.intensity=.1+.8*d;lamp.intensity=1.1-.4*d;fw.rotation.z=t*.25;gondolas.forEach(g=>g.rotation.z=-fw.rotation.z);clouds.forEach(c=>{c.position.x=((c.userData.x+t*1.5+120)%240+240)%240-120;c.material.color.setScalar(.3+.7*d)})}

// furniture
const tvC=document.createElement("canvas");tvC.width=256;tvC.height=144;const tg=tvC.getContext("2d");const tvT=new THREE.CanvasTexture(tvC);
box(4.4,2.6,.2,0x222222,0,2.1,-7.7);
const scr=new THREE.Mesh(new THREE.PlaneGeometry(4,2.2),new THREE.MeshBasicMaterial({map:tvT}));scr.position.set(0,2.1,-7.58);scene.add(scr);
box(3,.7,1.1,0x7a2e4d,0,.35,-4.6);box(3,.9,.3,0x66243f,0,.9,-5.05);
box(1.8,1.1,1.8,0x4a7a3a,6,.55,-5);
box(2.6,.5,3.4,0xd8c7a3,-6,.25,5);box(2.6,.35,1,0xe9dcc0,-6,.6,6.2);
const POIS=[{need:"fun",p:V(0,1.5,-3.4),n:"the TV"},{need:"hunger",p:V(6,1.7,-5),n:"the trash buffet"},{need:"energy",p:V(-6,1.2,5),n:"the bed"},{need:"fun",p:V(-28,1.5,58),n:"the park bench"},{need:"fun",p:V(30,1.6,52),n:"the ferris wheel"},{need:"fun",p:V(0,1.8,30),n:"the fountain"},{need:"hunger",p:V(10,1.7,24.5),n:"the food stall"},{need:"energy",p:V(-12,1.4,46),n:"the hammock"}];

function drawTV(t){tg.fillStyle="#111";tg.fillRect(0,0,256,144);const cols=["#e0483a","#f2b632","#5fbf7a","#4aa3e0","#a35fd6"];for(let i=0;i<5;i++){tg.fillStyle=cols[(i+Math.floor(t*2))%5];tg.fillRect(i*51,20,51,70+Math.sin(t*3+i)*30)}tg.fillStyle="#fff";tg.font="bold 18px Georgia";tg.fillText("FlyTube ▶ live",12,128);tvT.needsUpdate=true}

// flies
const NEEDS=["hunger","energy","fun","social"];
const DEFS=[["Buzz",0xe0483a,{hunger:1.4}],["Nibbles",0xf2b632,{hunger:1.8}],["Zee",0x4aa3e0,{energy:1.8}],["Flap",0x5fbf7a,{fun:1.7}],["Marge",0xa35fd6,{social:1.9}],["Gnat",0xf08cc0,{}]];
const flies=[];
const hud=document.getElementById("hud");
DEFS.forEach(([name,col,tr],i)=>{
 const g=new THREE.Group();const body=new THREE.Group();g.add(body);
 const dark=new THREE.MeshLambertMaterial({color:0x2a2a2a});
 const b=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),dark);b.scale.set(1,.85,1.4);body.add(b);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.1,12,10),new THREE.MeshLambertMaterial({color:col}));h.position.z=.25;body.add(h);
 [-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.04,8,8),new THREE.MeshBasicMaterial({color:0xffffff}));e.position.set(s*.06,.04,.32);body.add(e)});
 const wm2=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55,side:THREE.DoubleSide});
 const wings=[-1,1].map(s=>{const p=new THREE.Group();const w=new THREE.Mesh(new THREE.PlaneGeometry(.3,.16),wm2);w.rotation.x=-Math.PI/2;w.position.x=s*.15;p.add(w);p.position.y=.12;body.add(p);return p});
 g.scale.setScalar(2.2);g.position.set((Math.random()-.5)*10,2+Math.random()*2,(Math.random()-.5)*10);scene.add(g);
 const lbl=document.createElement("div");lbl.className="lbl";document.body.appendChild(lbl);
 const row=document.createElement("div");row.className="f";row.innerHTML=`<b>${name}</b><span class="a"></span><div class="bars">${NEEDS.map(()=>"<i><span></span></i>").join("")}</div>`;hud.appendChild(row);
 const rate={};NEEDS.forEach(k=>rate[k]=(.8+Math.random()*.4)*(tr[k]||1));
 const n={};NEEDS.forEach(k=>n[k]=40+Math.random()*50);
 flies.push({name,g,body,wings,lbl,row,rate,n,state:"idle",need:null,tgt:null,tf:null,useT:0,phase:Math.random()*6,off:V(0,0,0),act:""});
});

function pick(f){
 let k=NEEDS[0];NEEDS.forEach(x=>{if(f.n[x]<f.n[k])k=x});
 f.need=k;f.state="go";f.q=null;f.useT=0;f.off.set((Math.random()-.5)*1.2,0,(Math.random()-.5)*1.2);
 if(k==="social"){const o=flies.filter(x=>x!==f);f.tf=o[Math.floor(Math.random()*o.length)];f.act="going to chat with "+f.tf.name}
 else{const o=POIS.filter(p=>p.need===k);f.tgt=o[Math.floor(Math.random()*o.length)];f.tf=null;f.act="heading to "+f.tgt.n}
}
const USE={fun:"watching FlyTube",hunger:"eating trash",energy:"napping",social:"chatting"};
function stepFly(f,dt,t){
 NEEDS.forEach(k=>f.n[k]=Math.max(0,f.n[k]-f.rate[k]*dt));
 if(f.state==="idle")pick(f);
 let dest=f.tf?f.tf.g.position.clone().add(f.off):f.tgt.p.clone().add(f.off);f.wp=false;if(f.state==="go"){const P=f.g.position;if(inT(P)===inT(dest))f.q=null;else{if(!f.q)f.q=inT(P)?(Math.abs(P.x)>1.5?[V(0,2,6),V(0,2,11)]:[V(0,2,11)]):(Math.abs(P.x)<1.5&&P.z>8?[]:[V(0,2,11)]);while(f.q.length&&P.distanceTo(f.q[0])<.8)f.q.shift();if(f.q.length){dest=f.q[0];f.wp=true}}}
 const d=dest.clone().sub(f.g.position),dist=d.length();
 if(f.state==="go"){
  if(dist<.6&&!f.wp){f.state="use";f.act=f.tf?"chatting with "+f.tf.name:USE[f.need]}
  else{d.normalize();f.g.position.addScaledVector(d,Math.min(4.5*dt,dist));
   let a=Math.atan2(d.x,d.z)-f.g.rotation.y;a=Math.atan2(Math.sin(a),Math.cos(a));f.g.rotation.y+=a*Math.min(1,dt*6)}
 }else{
  f.useT+=dt;f.n[f.need]=Math.min(100,f.n[f.need]+14*dt);
  if(f.tf)f.tf.n.social=Math.min(100,f.tf.n.social+8*dt);
  f.g.position.addScaledVector(d,Math.min(1,dt*2));
  if(f.n[f.need]>=95||f.useT>14)f.state="idle";
 }
 f.body.position.y=Math.sin(t*4+f.phase)*.06;
 const fl=Math.sin(t*70+f.phase)*.7;f.wings[0].rotation.z=fl;f.wings[1].rotation.z=-fl;
}

// player
let yaw=0,pitch=0;const keys={};const pp=V(0,1.7,6.5);
addEventListener("keydown",e=>keys[e.code]=true);addEventListener("keyup",e=>keys[e.code]=false);
let drag=false,lx=0,ly=0;
c.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)});
c.addEventListener("pointermove",e=>{if(!drag)return;yaw-=(e.clientX-lx)*.004;pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});
c.addEventListener("pointerup",()=>drag=false);
document.querySelectorAll("#pad button").forEach(b=>{const k=b.dataset.k;b.addEventListener("pointerdown",()=>keys[k]=true);["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
function walk(dt){
 const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),r=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 const sp=(keys.ShiftLeft?11:6)*dt,nx=pp.x+(-Math.sin(yaw)*f+Math.cos(yaw)*r)*sp,nz=pp.z+(-Math.cos(yaw)*f-Math.sin(yaw)*r)*sp;if(!hit(nx,pp.z))pp.x=nx;if(!hit(pp.x,nz))pp.z=nz;
 pp.x=Math.max(-95,Math.min(95,pp.x));pp.z=Math.max(-95,Math.min(95,pp.z));
 cam.position.copy(pp);cam.rotation.set(pitch,yaw,0);
}

// object recipes: flies ask in words, a model returns this JSON, the site validates it before drawing anything
function build(r){
 if(!r||!Array.isArray(r.parts)||r.parts.length<1||r.parts.length>24)return null;
 const g=new THREE.Group();
 for(const q of r.parts){
  if(!["box","sphere","cylinder"].includes(q.s))return null;
  if(!Array.isArray(q.z)||q.z.length!==3||!q.z.every(v=>typeof v==="number"&&v>=.02&&v<=3))return null;
  if(!Array.isArray(q.p)||q.p.length!==3||!q.p.every(v=>typeof v==="number"&&Math.abs(v)<=4))return null;
  if(typeof q.c!=="string"||!/^#[0-9a-f]{6}$/i.test(q.c))return null;
  const geo=q.s==="box"?new THREE.BoxGeometry(q.z[0],q.z[1],q.z[2]):q.s==="sphere"?new THREE.SphereGeometry(q.z[0]/2,16,12):new THREE.CylinderGeometry(q.z[0]/2,q.z[0]/2,q.z[1],16);
  const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:q.c}));m.position.set(q.p[0],q.p[1],q.p[2]);g.add(m);
 }
 return g;
}

// ---------- network: the server runs the flies; this page shows them ----------
const HELP="Drag to look \u00b7 WASD or arrows to walk \u00b7 Shift to run";
let ws,myId=0,snap=null,lastSend=0;
const helpEl=document.getElementById("help"),inbox=document.getElementById("inbox"),rq=document.getElementById("rq");
inbox.style.display="none";
const hs=document.createElement("span"),adm=document.createElement("a");adm.textContent=" \u00b7 Admin login";adm.style.cursor="pointer";adm.style.textDecoration="underline";
adm.onclick=()=>{const t=prompt("Admin token");if(t){try{sessionStorage.fctoken=t}catch{}if(ws)ws.close()}};
helpEl.textContent="";helpEl.append(hs,adm);hs.textContent="Connecting\u2026";
let nm="";try{nm=localStorage.fcname||"";if(!nm){nm=(prompt("Pick a name (letters, max 16)")||"").slice(0,16);localStorage.fcname=nm}}catch{}
function hello(){let tk="";try{tk=sessionStorage.fctoken||""}catch{}ws.send(JSON.stringify({t:"hello",name:nm,token:tk}))}
function addObj(r){const g=build(r);if(!g)return;g.position.set(r.at[0],r.hang?4.6:0,r.at[1]);scene.add(g)}
function addReq(r){
 if(document.getElementById("r"+r.id))return;
 const d=document.createElement("div");d.className="r";d.id="r"+r.id;
 const b=document.createElement("b");b.textContent=r.fly;d.append(b," wants "+r.recipe.name,document.createElement("br"));
 [["Approve","y","approve"],["Deny","n","deny"]].forEach(([txt,cls,t])=>{const x=document.createElement("button");x.className=cls;x.textContent=txt;x.onclick=()=>ws.send(JSON.stringify({t,id:r.id}));d.append(x)});
 rq.prepend(d);
}
function connect(){
 ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
 ws.onopen=()=>{hs.textContent=HELP;hello()};
 ws.onclose=()=>{hs.textContent="Reconnecting\u2026";setTimeout(connect,2000)};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
  if(m.t==="init"){myId=m.you;m.objects.forEach(addObj)}
  else if(m.t==="snap"){snap=m;updPlayers(m.players)}
  else if(m.t==="obj")addObj(m.recipe);
  else if(m.t==="admin"){inbox.style.display="block";m.requests.forEach(addReq)}
  else if(m.t==="req")addReq(m.req);
  else if(m.t==="reqdone"){const d=document.getElementById("r"+m.id);if(d)d.remove()}};
}
connect();
function netFly(f,i,dt,t){
 const s=snap&&snap.flies[i];
 if(s){const P=f.g.position;if(!f.init){P.set(s.x,s.y,s.z);f.g.rotation.y=s.ry;f.init=true}
  const k=Math.min(1,dt*12);P.x+=(s.x-P.x)*k;P.y+=(s.y-P.y)*k;P.z+=(s.z-P.z)*k;
  let a=s.ry-f.g.rotation.y;a=Math.atan2(Math.sin(a),Math.cos(a));f.g.rotation.y+=a*k;
  f.act=s.act;NEEDS.forEach((n,j)=>f.n[n]=s.n[j])}
 f.body.position.y=Math.sin(t*4+f.phase)*.06;const fl=Math.sin(t*70+f.phase)*.7;f.wings[0].rotation.z=fl;f.wings[1].rotation.z=-fl;
}
const others=new Map();
function updPlayers(list){
 const seen=new Set();
 list.forEach(p=>{if(p.id===myId)return;seen.add(p.id);let o=others.get(p.id);
  if(!o){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,1.1,10),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL((p.id*.37)%1,.6,.55)}));b.position.y=.55;
   const h=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),new THREE.MeshLambertMaterial({color:0xf3d2b0}));h.position.y=1.3;g.add(b,h);g.position.set(p.x,0,p.z);scene.add(g);
   const l=document.createElement("div");l.className="lbl";document.body.appendChild(l);o={g,l};others.set(p.id,o)}
  o.t=p;o.l.textContent=p.name});
 others.forEach((o,id)=>{if(!seen.has(id)){scene.remove(o.g);o.l.remove();others.delete(id)}});
}
function net(dt){
 lastSend+=dt;if(lastSend>.1&&ws&&ws.readyState===1){lastSend=0;ws.send(JSON.stringify({t:"pos",x:pp.x,y:pp.y,z:pp.z,yaw}))}
 others.forEach(o=>{if(!o.t)return;const k=Math.min(1,dt*10);o.g.position.x+=(o.t.x-o.g.position.x)*k;o.g.position.z+=(o.t.z-o.g.position.z)*k;o.g.rotation.y=o.t.yaw+Math.PI;
  const v=o.g.position.clone();v.y+=1.8;v.project(cam);o.l.style.display=(v.z<1&&o.g.position.distanceTo(cam.position)<40)?"block":"none";o.l.style.left=((v.x*.5+.5)*innerWidth)+"px";o.l.style.top=((-v.y*.5+.5)*innerHeight)+"px"});
}

// loop
const clock=new THREE.Clock();let hudT=0;
function frame(){
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 walk(dt);net(dt);drawTV(t);dayNight(t);
 flies.forEach((f,i)=>netFly(f,i,dt,t));
 hudT-=dt;
 flies.forEach(f=>{
  const v=f.g.position.clone();v.y+=.6;v.project(cam);
  f.lbl.style.display=(v.z<1&&f.g.position.distanceTo(cam.position)<45)?"block":"none";
  f.lbl.style.left=((v.x*.5+.5)*innerWidth)+"px";f.lbl.style.top=((-v.y*.5+.5)*innerHeight)+"px";
  if(hudT<=0){f.lbl.textContent=f.name+" · "+f.act;f.row.querySelector(".a").textContent=f.act;f.row.querySelectorAll(".bars span").forEach((s,i)=>s.style.width=f.n[NEEDS[i]]+"%")}
 });
 if(hudT<=0)hudT=.3;
 renderer.render(scene,cam);requestAnimationFrame(frame);
}
addEventListener("resize",()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
frame();
</script>
</body>
</html>
